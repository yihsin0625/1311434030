<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>減脂小廚房</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

<div id="start"><h1>🥗 減脂小廚房</h1><p style="margin:0;color:var(--mu)">選擇你的娃娃，開始控制熱量吧！</p><div class="pick"><button data-g="m">👦<span>男生</span></button><button data-g="f">👧<span>女生</span></button></div></div>

<div class="p on card" id="p-feed"><div class="row"><input id="fin" list="fl" placeholder="輸入食物，例如：雞胸肉" style="flex:1;min-width:160px"><button class="btn" id="fadd">出現食物</button><button class="btn g" id="fclr">清空</button></div><datalist id="fl"></datalist>
<div class="big" style="margin-bottom:6px">把食物拖到娃娃嘴巴，或直接點一下就餵食（份量為一般一份）</div><div class="tray" id="ftray"></div><div id="msg1" class="big"></div></div>

<div class="p card" id="p-ex"><div class="row"><input id="xin" list="xl" placeholder="運動項目，例如：跑步" style="flex:1;min-width:140px"><input id="xmin" type="number" value="30" min="1" max="300" style="width:80px"> 分鐘</div><div class="row"><button class="btn g" data-m="10">10</button><button class="btn g" data-m="20">20</button><button class="btn g" data-m="30">30</button><button class="btn g" data-m="45">45</button><button class="btn g" data-m="60">60</button><button class="btn" id="xadd">完成運動 💪</button></div><datalist id="xl"></datalist><div id="msg2" class="big"></div></div>

<div class="p card" id="p-cook"><div class="row"><input id="cin" list="fl" placeholder="輸入食材，例如：雞胸肉" style="flex:1;min-width:160px"><button class="btn" id="cadd">拿出食材</button><button class="btn g" id="cclr">清空</button></div>
<div class="cgrid"><div><div class="tray" id="ctray"></div><div id="msg3" class="big"></div></div><div id="side"><h4 style="margin:0 0 4px">📖 <span id="rt">推薦食譜</span></h4><div id="recs"></div><button class="btn" id="aibtn">🔎 請 Claude 再找更多食譜</button><div id="airec" class="big" style="margin-top:8px"></div></div></div>
<div class="zones"><div class="zone" data-drop="pot"><h4>🍳 鍋子</h4><div id="potc"></div><button class="btn" data-cook="pot">開火！</button></div><div class="zone" data-drop="oven"><h4>🔥 烤箱</h4><div id="ovc"></div><button class="btn" data-cook="oven">烘烤！</button></div></div>
<div id="dish"></div></div>

<div class="p card" id="p-me"><div class="row"><label>身高 <input id="h" type="number" style="width:76px"> cm</label><label>體重 <input id="w" type="number" style="width:76px"> kg</label><label>年齡 <input id="a" type="number" style="width:64px"></label></div>
<div class="row"><select id="act"><option value="1.2">久坐少動</option><option value="1.375" selected>每週運動 1–3 次</option><option value="1.55">每週運動 3–5 次</option><option value="1.725">每週運動 6–7 次</option></select><select id="goal"><option value="lose">減脂</option><option value="keep">維持體重</option><option value="gain">增肌</option></select><button class="btn" id="calc">幫我計算</button></div><div id="plan"></div><h4>今日紀錄</h4><div class="log" id="log"></div><button class="btn g" id="reset" style="margin-top:8px">重新開始今天</button></div>
</div>

$("#doll").innerHTML=`<svg viewBox="0 0 200 230"><g style="transform:scaleX(${sx});transform-origin:100px 100px">${hair}<ellipse cx="100" cy="95" rx="72" ry="68" fill="#ffd9b8"/>${top}<circle cx="74" cy="100" r="8" fill="#2a2222"/><circle cx="126" cy="100" r="8" fill="#2a2222"/><circle cx="77" cy="97" r="3" fill="#fff"/><circle cx="129" cy="97" r="3" fill="#fff"/><circle cx="55" cy="122" r="10" fill="#ff9a9a" opacity=".5"/><circle cx="145" cy="122" r="10" fill="#ff9a9a" opacity=".5"/>${mouth}</g><rect x="70" y="160" width="60" height="58" rx="22" fill="${f?"#ff8fb0":"#5aa0ff"}"/><circle cx="62" cy="185" r="10" fill="#ffd9b8"/><circle cx="138" cy="185" r="10" fill="#ffd9b8"/></svg>`}
function bars(){$("#bars").innerHTML=N.map((n,i)=>{const e=S.eat[i],g=S.G[i]||1,p=Math.min(100,e/g*100),o=e>g&&(i==0||i==5||i==3);return`<div class="bar${o?" o":""}"><span>${n[0]}</span><i><b style="width:${p}%"></b></i><em>${Math.round(e*(i==7||i==4?10:1))/(i==7||i==4?10:1)} / ${Math.round(g)}${n[1]}</em></div>`}).join("");
$("#rem").textContent=Math.round(S.G[0]-S.eat[0]+S.burn);$("#eaten").textContent=Math.round(S.eat[0]);$("#burn").textContent=Math.round(S.burn)}
function chips(arr,ctx){return arr.length?arr.map(i=>`<div class="chip" data-i="${i}" data-c="${ctx}"><s>${F[i][1]}</s>${F[i][0]}<small>${F[i][2]}kcal</small>${OV.includes(F[i][0])?"<small>🔥限烤箱</small>":PO.includes(F[i][0])?"<small>🍳限鍋子</small>":""}</div>`).join(""):'<span class="big">還沒有食物，上面輸入名稱試試</span>'}
function render(){doll();bars();$("#ftray").innerHTML=chips(S.T.feed,"feed");$("#ctray").innerHTML=chips(S.T.cook,"cook");
["pot","oven"].forEach(k=>$(k=="pot"?"#potc":"#ovc").innerHTML=S[k].map((i,j)=>`<span data-rm="${k},${j}" title="點擊取出">${F[i][1]}</span>`).join("")||'<div class="big">拖食材進來</div>');
$("#dish").innerHTML=S.dish?`<div class="rec"><b>${S.dish.e} ${S.dish.n}</b><br>${S.dish.v[0].toFixed(0)} kcal・蛋白 ${S.dish.v[1].toFixed(0)}g・碳水 ${S.dish.v[2].toFixed(0)}g・脂肪 ${S.dish.v[3].toFixed(0)}g・纖維 ${S.dish.v[4].toFixed(1)}g<br><button class="btn" data-act="serve">餵給娃娃 😋</button></div>`:"";
recs();$("#log").innerHTML=S.log.slice().reverse().map(l=>`<div>${l}</div>`).join("")||"還沒有紀錄"}
function recs(){const pool=new Set([...S.T.cook,...S.pot,...S.oven].map(i=>F[i][0]));
const fo=S.focus;const L=R.filter(r=>!fo||r[2].some(x=>x==fo||x.includes(fo)||fo.includes(x))).map(r=>({r,s:r[2].filter(x=>pool.has(x)).length})).sort((a,b)=>b.s-a.s).slice(0,6);$("#rt").textContent=fo?`「${fo}」的食譜`:"推薦食譜";if(!L.length){$("#recs").innerHTML='<div class="big">內建食譜沒有這項，Claude 正在幫你找…</div>';return}
$("#recs").innerHTML=L.map(({r})=>{const v=r[2].reduce((a,n)=>add(a,F[F.findIndex(f=>f[0]==n)].slice(2)),z());return`<div class="rec"><b>${r[1]} ${r[0]}</b> <span class="tag">${r[3].includes("烤")?"🔥烤箱":"🍳鍋子"}</span>（約 ${Math.round(v[0])} kcal・蛋白 ${Math.round(v[1])}g）<br>${r[2].map(n=>`<span class="tag ${pool.has(n)?"h":"m"}" data-need="${n}">${pool.has(n)?"✓ ":"+ "}${n}</span>`).join("")}<br>${r[3]}</div>`}).join("")}
function say(t){$("#bubble").textContent=t}
function feed(v,e,n){S.eat=add(S.eat,v);S.log.push(`${e} 吃了${n}　+${Math.round(v[0])} kcal`);
const msg=S.eat[0]>S.G[0]?"吃撐了…今天熱量超標囉 😵":S.eat[5]>S.G[5]?"好鹹！要多喝水 💧":v[0]>400?"好吃，但熱量不低喔！":v[4]>3?"滿滿纖維，好健康 👍":["好吃～😋","謝謝你！","再來一口！"][Math.random()*3|0];
say(msg);$("#dollbox").classList.add("chew");setTimeout(()=>$("#dollbox").classList.remove("chew"),800);render()}
function plan(){const h=+$("#h").value,w=+$("#w").value,a=+$("#a").value,af=+$("#act").value,go=$("#goal").value,m=S.g=="m";
const bmr=10*w+6.25*h-5*a+(m?5:-161),tdee=bmr*af;let kc=go=="lose"?Math.max(tdee*.8,bmr,m?1500:1200):go=="gain"?tdee+300:tdee;
const p=w*(go=="lose"?2:go=="gain"?1.8:1.6),f=kc*.25/9,c=(kc-p*4-f*9)/4;
S.G=[kc,p,c,f,kc/1000*14,2300,1000,m?8:18,m?90:75,m?3400:2600];
const bmi=w/((h/100)**2),wk=(tdee-kc)*7/7700;
const tips={lose:["每餐先吃蛋白質與蔬菜，再吃主食","主食改糙米、地瓜，增加飽足感與纖維","每週 3 次重訓＋2–3 次有氧，保留肌肉","少喝含糖飲料，水每天 2000 ml 以上"],keep:["維持三大營養素均衡","每週至少 150 分鐘中等強度運動"],gain:["訓練後 1 小時內補充蛋白質與碳水","每週 3–4 次重訓，逐步增加重量","睡眠 7–9 小時幫助肌肉恢復"]}[go];
$("#plan").innerHTML=`<div class="rec"><b>📋 你的每日方案</b><br>BMI ${bmi.toFixed(1)}・基礎代謝 ${Math.round(bmr)}・總消耗 ${Math.round(tdee)} kcal<br><b>目標熱量 ${Math.round(kc)} kcal</b>（蛋白 ${Math.round(p)}g・碳水 ${Math.round(c)}g・脂肪 ${Math.round(f)}g）<br>微量元素：纖維 ≥ ${Math.round(S.G[4])}g・鈉 ≤ 2300mg・鈣 1000mg・鐵 ${S.G[7]}mg・維C ${S.G[8]}mg・鉀 ${S.G[9]}mg<br>${go!="keep"?`預估每週約 ${wk>0?"減":"增"} ${Math.abs(wk).toFixed(2)} kg<br>`:""}${tips.map(t=>"• "+t).join("<br>")}</div>`;render()}
let SM=null;try{claude.use("sample").then(s=>{SM=s})}catch(e){}
const ask=(p)=>SM?SM.json(p,{modelTier:"quick"}):Promise.reject(1);
async function getFood(q){let i=find(q);if(i>=0)return i;try{const d=await ask(`你是營養師。使用者輸入的食物是「${q}」。請估算一般一份的營養，只回傳 JSON，不要其他文字：{"name":"繁體中文名稱","emoji":"一個最貼切的emoji","kcal":數字,"protein":克,"carb":克,"fat":克,"fiber":克,"sodium":毫克,"calcium":毫克,"iron":毫克,"vitC":毫克,"potassium":毫克}。若不是食物，回傳 {"error":true}`);if(!d||d.error)return -1;F.push([d.name||q,d.emoji||"🍽",+d.kcal||0,+d.protein||0,+d.carb||0,+d.fat||0,+d.fiber||0,+d.sodium||0,+d.calcium||0,+d.iron||0,+d.vitC||0,+d.potassium||0]);return F.length-1}catch(e){return -1}}
async function getMET(q){let k=Object.keys(X).find(k=>k==q)||Object.keys(X).find(k=>k.includes(q)||q.includes(k));if(k)return[k,X[k]];try{const d=await ask(`運動項目「${q}」的 MET 值（代謝當量）是多少？只回傳 JSON：{"name":"繁體中文名稱","met":數字}。若不是運動，回傳 {"error":true}`);if(!d||d.error||!d.met)return null;X[d.name||q]=+d.met;return[d.name||q,+d.met]}catch(e){return null}}
async function aiRecipes(){const pool=[...new Set([...S.T.cook,...S.pot,...S.oven].map(i=>F[i][0]))];const el=$("#airec");if(!pool.length){el.textContent="先拿出一些食材，我再幫你找食譜";return}el.textContent="🔎 Claude 正在想食譜…";try{const d=await ask(`請以「${S.focus||pool[0]}」為主角，推薦 4 道適合減脂、健身的料理（至少 1 道用烤箱、1 道用鍋子），可搭配手邊食材：${pool.join("、")}。可補充少量常見調味或食材。只回傳 JSON 陣列：[{"name":"菜名","emoji":"emoji","method":"鍋煮或烤箱","ingredients":["食材名"],"steps":"簡短做法","kcal":數字}]，使用繁體中文`);el.innerHTML=d.map(r=>`<div class="rec"><b>${r.emoji||"🍽"} ${r.name}</b>（約 ${Math.round(r.kcal)} kcal・${r.method||""}）<br>${(r.ingredients||[]).map(n=>`<span class="tag ${pool.includes(n)?"h":"m"}" data-ai="${n}">${pool.includes(n)?"✓ ":"+ "}${n}</span>`).join("")}<br>${r.steps}</div>`).join("")}catch(e){el.textContent="目前無法查詢，請確認已允許 Claude 並稍後再試"}}
// events
$$("#start button").forEach(b=>b.onclick=()=>{S.g=b.dataset.g;$("#h").value=S.g=="m"?175:162;$("#w").value=S.g=="m"?70:55;$("#a").value=25;$("#start").hidden=true;$("#start").style.display="none";$("#app").hidden=false;plan()});
$$("nav button").forEach(b=>b.onclick=()=>{$$("nav button").forEach(x=>x.classList.toggle("on",x==b));$$(".p").forEach(p=>p.classList.toggle("on",p.id=="p-"+b.dataset.t))});
async function addFood(inp,key,msg){const q=$(inp).value.trim();if(!q)return;$(msg).textContent="🔎 查詢中…";const i=await getFood(q);if(i<0){$(msg).textContent="查不到這個食物，換個說法試試看（需允許 Claude 查詢）";return}$(msg).textContent="";S.T[key].push(i);$(inp).value="";if(key=="cook")S.focus=F[i][0];render();if(key=="cook")aiRecipes()}
$("#fadd").onclick=()=>addFood("#fin","feed","#msg1");$("#fin").onkeydown=e=>e.key=="Enter"&&addFood("#fin","feed","#msg1");
$("#cadd").onclick=()=>addFood("#cin","cook","#msg3");$("#cin").onkeydown=e=>e.key=="Enter"&&addFood("#cin","cook","#msg3");$("#aibtn").onclick=aiRecipes;
document.addEventListener("click",async e=>{const n=e.target.dataset.ai;if(n&&e.target.classList.contains("m")){const i=await getFood(n);if(i>=0){S.T.cook.push(i);render();aiRecipes()}}});
$("#fclr").onclick=()=>{S.T.feed=[];render()};$("#cclr").onclick=()=>{S.focus=null;$("#airec").innerHTML="";S.T.cook=[];S.pot=[];S.oven=[];S.dish=null;render()};
$$("[data-m]").forEach(b=>b.onclick=()=>$("#xmin").value=b.dataset.m);
$("#xadd").onclick=async()=>{const q=$("#xin").value.trim(),mn=+$("#xmin").value;if(!q||!mn)return;$("#msg2").textContent="🔎 查詢中…";const r=await getMET(q);
if(!r){$("#msg2").textContent="查不到這個運動，換個說法試試看（需允許 Claude 查詢）";return}
const k=r[0],kc=r[1]*(+$("#w").value||60)*mn/60;S.burn+=kc;S.log.push(`🏃 ${k} ${mn} 分鐘　−${Math.round(kc)} kcal`);$("#msg2").textContent=`${k} ${mn} 分鐘，消耗約 ${Math.round(kc)} kcal，太棒了！`;say("運動完可以多吃一點點 💪");$("#xin").value="";render()};
$("#calc").onclick=plan;$("#reset").onclick=()=>{S.eat=z();S.burn=0;S.log=[];S.dish=null;say("新的一天開始！");render()};
$("#recs").onclick=e=>{const n=e.target.dataset.need;if(n&&e.target.classList.contains("m")){S.T.cook.push(F.findIndex(f=>f[0]==n));render()}};
document.addEventListener("click",e=>{const r=e.target.dataset.rm;if(r){const[k,j]=r.split(",");S[k].splice(+j,1);render()}
const c=e.target.dataset.cook;if(c)cook(c);if(e.target.dataset.act=="serve"&&S.dish){feed(S.dish.v,S.dish.e,S.dish.n);S.dish=null;render()}});
function cook(k){const it=S[k];if(!it.length){say("先放食材進去喔！");return}const names=it.map(i=>F[i][0]);
const v=it.reduce((a,i)=>add(a,F[i].slice(2)),z());const hit=R.filter(r=>r[2].every(n=>names.includes(n))).sort((a,b)=>b[2].length-a[2].length)[0];
S.dish=hit?{n:hit[0],e:hit[1],v}:{n:"自創"+(k=="pot"?"炒鍋":"烤箱")+"料理",e:k=="pot"?"🍳":"🔥",v};S[k]=[];render()}
// drag
let D=null;const under=e=>document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-drop]");
document.addEventListener("pointerdown",e=>{const c=e.target.closest(".chip");if(c&&!c.classList.contains("ghost"))D={c,x:e.clientX,y:e.clientY,go:false}});
addEventListener("pointermove",e=>{if(!D)return;if(!D.go&&Math.hypot(e.clientX-D.x,e.clientY-D.y)>8){D.go=true;D.el=D.c.cloneNode(true);D.el.classList.add("ghost");document.body.appendChild(D.el)}
if(D.go){D.el.style.left=e.clientX+"px";D.el.style.top=e.clientY+"px";const t=under(e);$$("[data-drop]").forEach(x=>x.classList.toggle("hot",x==t));const o=!!t&&t.dataset.drop=="doll"&&D.c.dataset.c=="feed";if(o!=S.open){S.open=o;doll()}}});
addEventListener("pointerup",e=>{if(!D)return;const d=D;D=null;const i=+d.c.dataset.i,cx=d.c.dataset.c;let t=null;
if(d.go){t=under(e);d.el.remove();$$("[data-drop]").forEach(x=>x.classList.remove("hot"));S.open=false}
const f=F[i];if(cx=="feed"&&(!d.go||t&&t.dataset.drop=="doll"))feed(f.slice(2),f[1],f[0]);
else if(cx=="cook"){const z2=d.go?(t&&["pot","oven"].includes(t.dataset.drop)?t.dataset.drop:null):"pot";const m3=$("#msg3");const dz=cx=="cook"&&!d.go&&OV.includes(f[0])?"oven":z2;if(dz&&dz=="pot"&&OV.includes(f[0]))m3.textContent=`${f[0]}只能放進烤箱 🔥`;else if(dz&&dz=="oven"&&PO.includes(f[0]))m3.textContent=`${f[0]}只能放進鍋子 🍳`;else if(dz){m3.textContent="";S[dz].push(i)}}
render()});
render();
</script></body></html>
